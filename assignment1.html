<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment1</title>
</head>

<style>
    html,body{
        height :100%;
        margin : 0;
        overflow-x:hidden;
    }
    *, *::before, *::after { box-sizing: border-box; }
    .main-flex{
        display: flex;
        align-items:stretch;
        min-height: 100vh;
        
    }
    .main-flex > * {min-width:0;}
    #sidebar{
        width:300px;
        max-width: 100%;
        background-color: white;
        padding:25px;
        box-shadow: 2px 0px 10px black;
        overflow-y: auto;

    }
    
    input[type="text"], textarea ,input[type="file"]{
        width: 100%;
        max-width: 100%;
    }
      .landmark-item{
        background-color: white;
        color:black;
        border: 1px solid black;
        padding: 10px;
        margin-bottom: 10px;
        cursor: pointer;
    }
      .landmark-item.highlight{
        background-color: green;
        color:white;
        transition: background-color 0.5s ease;
    }


    #map {
        flex:1 1 auto;
        min-width: 0;
        min-height: 100vh;
        height: 100vh;
    }
    
 
     @media( max-width: 800px){
        .main-flex {flex-direction: column;}
        #sidebar{width:100%;}
        #map { width:100%; height: 50vh;}
    }

</style>
<body>
<div class = "main-flex">
    <div id = "sidebar">
     <lable>Landmark information</lable>
        <br />
        <label for = "address">Address:</label>
        <input type = "text" id="address">
         <br />
        <label for="Name">Name:</label>
        <input type = "text" id="Name">
         <br />
        <label for="Description">Description:</label>
        
        <textarea id="Description"></textarea>
         <br />
        <label for="photo">Photo:</label>
        <input type="file" id="photo" accept="image/*">
         <br />
         <button id ="locate">Locate on Map</button>
          <br/>

          
        <label>Map diplay error Messages:</label>
        <div id="error_display"> </div>

        <label>data input error Messages:</label>
        <div id="error_data"> </div>

         <div id = "landmark_list">
            <h1> Landmark List</h1>
            <div id = "landmark_items">

            </div>
         </div>
    </div>
    
    


    <div id="map"></div>
</div>

<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyALj9NJ2A5fwkFgJbfBTJhqZO64KBDSVcA&callback=initMap&v=weekly&libraries=marker"
defer
></script>
<script>

    let landmarks =[];
    let infowindows = [];

    const defaultLocation = {
            lat : 43.6532
            ,lng : -79.3822
        }

  function initMap()
    {   


        map = new google.maps.Map(document.getElementById("map"),
        {
            center: defaultLocation,
            zoom: 10,
            mapId:"f23a3bb7a28da2c38f4fa764"
        });

        
        geocoder = new google.maps.Geocoder();

        if (navigator.geolocation)
        {
            navigator.geolocation.getCurrentPosition(showPosition, handleerror);

        }
        
        function showPosition(position)
        {
            const userLocation ={
                lat: position.coords.latitude,
                lng: position.coords.longitude
            }

            userCurrentLocation=userLocation

            map.setCenter(userLocation);
            map.setZoom(12);
        }

         function handleerror(error)
        {
            const error_display = document.getElementById("error_display");

             switch(error.code) 
            {
                case error.PERMISSION_DENIED:
                    error_display.innerHTML = "User denied the request for Geolocation."
                break;
                case error.POSITION_UNAVAILABLE:
                    error_display.innerHTML = "Location information is unavailable."
                break;
                case error.TIMEOUT:
                    error_display.innerHTML = "The request to get user location timed out."
                break;
                case error.UNKNOWN_ERROR:
                error_display.innerHTML = "An unknown error occurred."
                break;
             }
        }

    }

     function ValidateDataType()
    {

        
        const address = document.getElementById("address").value;
        const title = document.getElementById("Name").value;
        const description = document.getElementById("Description").value;
        const photo = document.getElementById("photo")
        const error_data = document.getElementById("error_data");

        if (address === "" || title ==="" || description === "" || photo.files.length ===0){
            error_data.innerHTML = "All data fields are required.";
            return false;
        }
        else {
            error_data.innerHTML = "no errors."
            return true;
        }

    }




    function geocodeaddress()
    {
        const address = document.getElementById("address").value;
        const title = document.getElementById("Name").value;
        const description = document.getElementById("Description").value;
        const photo = document.getElementById("photo")
        const imageURL = URL.createObjectURL(photo.files[0]);
        
        geocoder.geocode( {'address':address}, function(results,status){

            if (status =="OK"){

                    const marker=new google.maps.marker.AdvancedMarkerElement({
                    map:map,
                    position:{lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng()},
                    
                });


                const contentString = 
                    "<h3>" + title + "</h3>" +
                    "<p>" + description + "</p>" +
                    "<img src='" + imageURL + "' width = '150' height = '150'/>";
                const infowindow = new google.maps.InfoWindow({
                    content: contentString
                })

                landmarks.push({
                    title: title,
                    address: address,
                    marker:marker,
                    position: {lat: results[0].geometry.location.lat(), lng: results[0].geometry.location.lng()}
                });

                infowindows.push(infowindow);
                
                const landmarkIndex = landmarks.length -1;
                marker.addListener("click",function(){
                    highlightlandmark(landmarkIndex);
                    infowindow.open({
                        anchor: marker,
                        shouldFocus: false
                    })
                })
                UpdateLandmarkList();

                document.getElementById("address").value ="";
                document.getElementById("Name").value ="";
                document.getElementById("Description").value ="";
                document.getElementById("photo").value ="";
                document.getElementById("error_data").innerHTML ="";



            }
            else {
                document.getElementById("error_display").innerHTML = "Geocode was not successful for the following reason: " + status;
            }
        });

       

      

        
    }

    function UpdateLandmarkList()
    {
        const Landmark_items = document.getElementById("landmark_items");

        if (landmarks.length ===0){
            Landmark_items.innerHTML = "<p>No landmarks added yet.</p>";
            return;
        }
       
        Landmark_items.innerHTML ="";
        landmarks.forEach(function(item, index){
            const LandmarkDiv = document.createElement("div");
            LandmarkDiv.className = "landmark-item";
            LandmarkDiv.id = "landmark-" + index;

            LandmarkDiv.innerHTML = "<h3>" + item.title + "</h3>" +
                                    "<p>" + item.address + "</p>";
                                    
           
            Landmark_items.appendChild(LandmarkDiv);
            
            });
        
    }

    
     const locate_location =document.getElementById("locate");
    locate_location.addEventListener("click", function(){
        if (ValidateDataType()){
            geocodeaddress();
        }
    } );


    function highlightlandmark(index)
    {

        const allLandmarks = document.querySelectorAll(".landmark-item");
        allLandmarks.forEach(function(item){
            item.classList.remove("highlight");
        });


        const activeLandmark = document.getElementById("landmark-" + index);
        if (activeLandmark){
            activeLandmark.classList.add("highlight");
            
        }
        

    }

</script>

</body>
</html>
